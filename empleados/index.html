<!DOCTYPE html>
<html lang="es">
<head>
    <script src="./JS/jquery-3.3.1.min.js"></script>
    <script src="RESOURCES/popper/umd/popper.js"></script>
    <script src="RESOURCES/bootstrap/js/bootstrap.js"></script>
    <script src="JS/bootbox.min.js"></script>
    <script language="javascript" src="./JS/main.js"></script>
    <script type="text/javascript" src="JS/AES.js"></script>
    <script type="text/javascript" src="JS/BCRYPT.js"></script>
    <script type="text/javascript" src="JS/toast.js"></script>
    <link href="RESOURCES/bootstrap/css/bootstrap.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 350px;
            text-align: center;
        }
        .panel-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            height: 80vh;
            text-align: center;
            margin-bottom: 1%;
        }

        .login-container h2 {
            margin-bottom: 1rem;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #2889a7;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .login-btn:hover {
            background: #227d99;
        }
        #panelEntradasSalidas{
            background: white;
            margin: 1%;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 10px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 98%;
            height: 40vh;
            text-align: center;
            overflow: auto;
            font-size: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="login-container" id="panel1">
        <h2>Iniciar Sesión</h2>
       
        <div class="input-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button class="login-btn" onclick="login()">Enviar</button>
    </div>
    <div class="login-container" id="panel2" style="display: none;">
        <h2>Introduce tu nueva clave</h2>
                <div class="input-group">
                <label for="password1">Nueva clave</label>
                <input type="password" id="password1" name="password1" required>
            </div>
            <div class="input-group">
                <label for="password2">Confirmar clave</label>
                <input type="password" id="password2" name="password2" required>
            </div>
            <button  class="login-btn" onclick="cambiarClave()">Enviar</button>
       
    </div>
    <input id=idEmpleado type=hidden>
    <div class="panel-container" id="panel3" style="display: none;">
        <h6>Historial</h6>
        <div id="panelEntradasSalidas" > 
            
        </div>
        <button type="submit" class="login-btn" onclick="enviarEntradaSalida('Entrada')">Introducir Entrada</button>
        <br><br>
        <button type="submit" class="login-btn" onclick="enviarEntradaSalida('Salida')">Introducir Salida</button>
        
    </div>

</body>
</html>
